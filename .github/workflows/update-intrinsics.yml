name: Update Intrinsics Database

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src

      - name: Extract intrinsics from current Rust
        run: python3 xtask/extract_intrinsics.py > docs/intrinsics/complete_intrinsics.csv

      # `xtask generate` reads safe_unaligned_simd's SOURCE out of the cargo
      # registry cache (xtask/src/main.rs, find_safe_simd_path_simple). xtask's
      # own dependency list does not include safe_unaligned_simd or archmage, so
      # `cargo run -p xtask` fetches only xtask's seven crates and the cache
      # never gains the one the tool actually reads. On a fresh runner that is
      # always a miss: this job has failed on every scheduled run in its visible
      # history (2026-03-01 through 2026-08-01, six consecutive months) with
      # "Could not find safe_unaligned_simd-0.2.5 in cargo cache. Run: cargo
      # fetch" — the error told us the fix and nothing was running it.
      #
      # A workspace-root `cargo fetch` downloads every workspace dependency,
      # safe_unaligned_simd included, which is what the next step needs.
      - name: Populate the cargo cache xtask reads from
        run: cargo fetch

      - name: Regenerate browser data
        run: cargo run -p xtask -- generate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet docs/intrinsics/ docs/intrinsics-browser/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A GitHub runner has no git identity, so `git commit` below fails
          # with "empty ident name ... not allowed" (exit 128). This step could
          # never have succeeded — it was simply never REACHED, because the job
          # died earlier at the cargo-cache miss on every scheduled run since at
          # least 2026-03-01. Fixing that miss is what exposed this.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RUST_VER=$(rustc --version | cut -d' ' -f2)
          BRANCH="update-intrinsics-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add docs/intrinsics/ docs/intrinsics-browser/
          git commit -m "docs: update intrinsics database for Rust $RUST_VER"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Update intrinsics for Rust $RUST_VER" \
            --body "Automated monthly intrinsics database refresh for Rust $RUST_VER."
