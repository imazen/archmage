name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CI: true
  FEATURES: "std avx512"

jobs:
  # A local reusable workflow runs the same matrix at this release's commit.
  # Do not replace this with a status check for a branch tip or another run.
  full-ci:
    name: Full release CI
    needs: check-tags
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # Verify tags and versions
  # ==========================================================================
  check-tags:
    name: Check Release Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Release tag '$TAG' does not match expected format v{version}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Verify all required tags exist and match
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FIRST_COMMIT=$(git rev-parse HEAD)
          for TAG in "v${VERSION}" "archmage-macros-v${VERSION}" "magetypes-v${VERSION}"; do
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              COMMIT=$(git rev-parse "${TAG}^{commit}")
              echo "✓ $TAG -> $COMMIT"
              if [ "$COMMIT" != "$FIRST_COMMIT" ]; then
                echo "::error::Tag $TAG points to $COMMIT, expected $FIRST_COMMIT"
                exit 1
              fi
            else
              echo "::error::Tag $TAG is MISSING"
              echo "Required: v${VERSION}, archmage-macros-v${VERSION}, magetypes-v${VERSION}"
              exit 1
            fi
          done

      - name: Verify workspace version matches tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # cargo metadata is the source of truth — reads workspace inheritance
          for CRATE in archmage archmage-macros magetypes; do
            CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name==\"$CRATE\") | .version")
            if [ "$CRATE_VERSION" != "$VERSION" ]; then
              echo "::error::$CRATE version ($CRATE_VERSION) does not match tag ($VERSION)"
              exit 1
            fi
            echo "✓ $CRATE: $CRATE_VERSION"
          done

  # ==========================================================================
  # Validate packaged sources as well as the full source-tree CI matrix.
  # ==========================================================================
  pre-publish-check:
    name: Verify Release Packages
    needs: check-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify all crates package and build
        run: cargo publish --workspace --dry-run

  # ==========================================================================
  # Publish all workspace crates in dependency order
  # cargo handles: ordering, temp registry for workspace deps, index polling
  # ==========================================================================
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    needs: [check-tags, pre-publish-check, full-ci]
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace
