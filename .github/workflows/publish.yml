name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CI: true
  FEATURES: "std avx512"

jobs:
  # A local reusable workflow runs the same matrix at this release's commit.
  # Do not replace this with a status check for a branch tip or another run.
  full-ci:
    name: Full release CI
    needs: check-tags
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # Verify tags and versions
  # ==========================================================================
  check-tags:
    name: Check Release Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      packages: ${{ steps.version.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Extract version and package selection from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            PACKAGES="-p archmage-macros -p archmage -p magetypes"
            MODE="core"
          elif [[ "$TAG" =~ ^magemath-v([0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            PACKAGES="-p magemath"
            MODE="magemath"
          else
            echo "::error::Release tag '$TAG' does not match v{version} or magemath-v{version}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Publishing ($MODE) version: $VERSION ($PACKAGES)"

      - name: Verify all required tags exist and match
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODE="${{ steps.version.outputs.mode }}"
          FIRST_COMMIT=$(git rev-parse HEAD)
          if [ "$MODE" = "magemath" ]; then
            TAGS=("magemath-v${VERSION}")
          else
            TAGS=("v${VERSION}" "archmage-macros-v${VERSION}" "magetypes-v${VERSION}")
          fi
          for TAG in "${TAGS[@]}"; do
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              COMMIT=$(git rev-parse "${TAG}^{commit}")
              echo "✓ $TAG -> $COMMIT"
              if [ "$COMMIT" != "$FIRST_COMMIT" ]; then
                echo "::error::Tag $TAG points to $COMMIT, expected $FIRST_COMMIT"
                exit 1
              fi
            else
              echo "::error::Tag $TAG is MISSING"
              exit 1
            fi
          done

      - name: Verify crate versions match tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODE="${{ steps.version.outputs.mode }}"
          if [ "$MODE" = "magemath" ]; then
            CRATES=(magemath)
          else
            CRATES=(archmage archmage-macros magetypes)
          fi
          for CRATE in "${CRATES[@]}"; do
            CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name==\"$CRATE\") | .version")
            if [ "$CRATE_VERSION" != "$VERSION" ]; then
              echo "::error::$CRATE version ($CRATE_VERSION) does not match tag ($VERSION)"
              exit 1
            fi
            echo "✓ $CRATE: $CRATE_VERSION"
          done

  # ==========================================================================
  # Validate packaged sources as well as the full source-tree CI matrix.
  # ==========================================================================
  pre-publish-check:
    name: Verify Release Packages
    needs: check-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify selected crates package and build
        run: cargo publish ${{ needs.check-tags.outputs.packages }} --dry-run

  # ==========================================================================
  # Publish selected workspace crates in dependency order
  # cargo handles: ordering, temp registry for workspace deps, index polling
  # ==========================================================================
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    needs: [check-tags, pre-publish-check, full-ci]
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish selected crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish ${{ needs.check-tags.outputs.packages }}
