name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]*"
      - "magemath-v[0-9]*"
  release:
    types: [published]

# Serialize tag-push and GitHub-Release runs for the same tag so a manual
# `gh release create` after `git push origin <tag>` never races `cargo publish`.
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CI: true
  FEATURES: "std avx512"

jobs:
  # A local reusable workflow runs the same matrix at this release's commit.
  # Do not replace this with a status check for a branch tip or another run.
  full-ci:
    name: Full release CI
    needs: check-tags
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # Verify tags and versions
  # ==========================================================================
  check-tags:
    name: Check Release Tags
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.version.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      packages: ${{ steps.version.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Extract version and package selection from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            PACKAGES="-p archmage-macros -p archmage -p magetypes"
            MODE="core"
          elif [[ "$TAG" =~ ^magemath-v([0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            PACKAGES="-p magemath"
            MODE="magemath"
          else
            echo "::error::Release tag '$TAG' does not match v{version} or magemath-v{version}"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Publishing ($MODE) tag $TAG -> version: $VERSION ($PACKAGES)"

      - name: Verify all required tags exist and match
        run: |
          git fetch --tags --force origin
          VERSION="${{ steps.version.outputs.version }}"
          MODE="${{ steps.version.outputs.mode }}"
          FIRST_COMMIT=$(git rev-parse HEAD)
          if [ "$MODE" = "magemath" ]; then
            TAGS=("magemath-v${VERSION}")
          else
            TAGS=("v${VERSION}" "archmage-macros-v${VERSION}" "magetypes-v${VERSION}")
          fi
          for TAG in "${TAGS[@]}"; do
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              COMMIT=$(git rev-parse "${TAG}^{commit}")
              echo "✓ $TAG -> $COMMIT"
              if [ "$COMMIT" != "$FIRST_COMMIT" ]; then
                echo "::error::Tag $TAG points to $COMMIT, expected $FIRST_COMMIT"
                exit 1
              fi
            else
              echo "::error::Tag $TAG is MISSING"
              exit 1
            fi
          done

      - name: Verify crate versions match tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODE="${{ steps.version.outputs.mode }}"
          if [ "$MODE" = "magemath" ]; then
            CRATES=(magemath)
          else
            CRATES=(archmage archmage-macros magetypes)
          fi
          for CRATE in "${CRATES[@]}"; do
            CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name==\"$CRATE\") | .version")
            if [ "$CRATE_VERSION" != "$VERSION" ]; then
              echo "::error::$CRATE version ($CRATE_VERSION) does not match tag ($VERSION)"
              exit 1
            fi
            echo "✓ $CRATE: $CRATE_VERSION"
          done

  # ==========================================================================
  # Validate packaged sources as well as the full source-tree CI matrix.
  # ==========================================================================
  pre-publish-check:
    name: Verify Release Packages
    needs: check-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify selected crates package and build
        run: |
          if [ "${{ needs.check-tags.outputs.mode }}" = "magemath" ]; then
            python3 - <<'PY'
          import json, tomllib, urllib.error, urllib.request
          from pathlib import Path

          manifest = tomllib.loads(Path("magemath/Cargo.toml").read_text())
          for dep in ("archmage", "magetypes"):
              req = manifest["dependencies"][dep]["version"].lstrip("^=~")
              prefix = f"{dep[:2]}/{dep[2:4]}"
              url = f"https://index.crates.io/{prefix}/{dep}"
              try:
                  body = urllib.request.urlopen(url, timeout=15).read().decode()
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"::error::{dep} index lookup failed ({exc.code}); publish {dep} first")
              versions = {json.loads(line)["vers"] for line in body.splitlines() if line.strip() and not json.loads(line).get("yanked")}
              if req not in versions:
                  raise SystemExit(
                      f"::error::magemath requires {dep} {req}, which is not yet on crates.io "
                      f"(tag and publish v{req} before magemath-v*)"
                  )
              print(f"✓ {dep} {req} is published on crates.io")
          PY
          fi
          cargo publish ${{ needs.check-tags.outputs.packages }} --dry-run

  # ==========================================================================
  # Publish selected workspace crates in dependency order
  # cargo handles: ordering, temp registry for workspace deps, index polling
  # ==========================================================================
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    needs: [check-tags, pre-publish-check, full-ci]
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish selected crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          MODE="${{ needs.check-tags.outputs.mode }}"
          VERSION="${{ needs.check-tags.outputs.version }}"
          PENDING=$(python3 - "$MODE" "$VERSION" <<'PY'
          import json, sys, urllib.error, urllib.request

          mode, version = sys.argv[1], sys.argv[2]
          crates = ["magemath"] if mode == "magemath" else ["archmage-macros", "archmage", "magetypes"]
          pending = []
          for crate in crates:
              prefix = f"{crate[:2]}/{crate[2:4]}"
              url = f"https://index.crates.io/{prefix}/{crate}"
              published = set()
              try:
                  body = urllib.request.urlopen(url, timeout=15).read().decode()
                  published = {json.loads(line)["vers"] for line in body.splitlines() if line.strip()}
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              if version in published:
                  print(f"✓ {crate}@{version} already published on crates.io", file=sys.stderr)
              else:
                  pending.append(f"-p {crate}")
          print(" ".join(pending))
          PY
          )
          if [ -n "$PENDING" ]; then
            echo "Publishing: $PENDING"
            cargo publish $PENDING
          else
            echo "All selected crates are already published at $VERSION; skipping duplicate upload."
          fi

      - name: Ensure GitHub Release exists for tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check-tags.outputs.tag }}"
          VERSION="${{ needs.check-tags.outputs.version }}"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "✓ GitHub Release $TAG already exists"
          else
            PRERELEASE_FLAG=()
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE_FLAG=(--prerelease)
            fi
            gh release create "$TAG" -R "${{ github.repository }}" --verify-tag --title "$TAG" --generate-notes "${PRERELEASE_FLAG[@]}"
          fi
