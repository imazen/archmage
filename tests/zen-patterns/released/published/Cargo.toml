[package]
name = "archmage-zen-patterns-released"
version = "0.0.0"
edition = "2024"
publish = false
description = "Archmage/Magetypes usage patterns from zen* crates that published 0.9.31 supports, compiled against crates.io 0.9.31."

# Shared sources; ../candidate/Cargo.toml builds the same files against the workspace.
[lib]
path = "../src/lib.rs"

[features]
default = []
# The consumer-side `avx512` feature that `cfg(avx512)` tier gates refer to.
avx512 = ["archmage/avx512", "magetypes/avx512"]

[dependencies]
archmage = { version = "=0.9.31", features = ["testable_dispatch"] }
magetypes = "=0.9.31"

[workspace]
