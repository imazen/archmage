[package]
name = "portable-f32-study"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
soft = ["libm/force-soft-floats"]

[dependencies]
archmage = { path = "../.." }
magetypes = { path = "../../magetypes", default-features = false, features = ["std"] }
zenmath = { path = "../../zenmath", features = ["std"] }
magemath = { path = "../../magemath" }
micromath = "=2.1.0"
libm = "=0.2.16"
fpmath = "=0.2.0"
metallic = "=0.3.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenbench = { version = "=0.1.11", default-features = false }

[profile.release]
lto = "thin"
