[package]
name = "algebraic-ext-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
[features]
default = []
avx512 = ["archmage/avx512", "magetypes/avx512", "algebraic-magetypes-prototype/avx512"]
wasm-bench = ["zenbench/wasm"]
[dependencies]
algebraic-magetypes-prototype = { path = "../ext" }
archmage = "=0.9.31-beta.2"
magetypes = { version = "=0.9.31-beta.2", features = ["std", "w512"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenbench = { version = "=0.1.11", default-features = false }
[[bin]]
name = "wasm-host"
required-features = ["wasm-bench"]
