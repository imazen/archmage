[package]
name = "archmage-sqrt-study"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[features]
default = ["std", "w512"]
std = ["archmage/std", "magetypes/std"]
w512 = ["magetypes/w512"]
avx512 = ["w512", "archmage/avx512", "magetypes/avx512"]

[dependencies]
archmage = { path = "../..", default-features = false }
magetypes = { path = "../../magetypes", default-features = false }
zenbench = "0.1.11"
