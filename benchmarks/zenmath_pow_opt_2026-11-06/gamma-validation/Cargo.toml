[package]
name="zenmath-gamma-validation"
version="0.0.0"
edition="2024"
publish=false
[workspace]
[features]
default=["runtime","proof"]
proof=["zenmath/archmage","dep:archmage"]
runtime=["zenmath/runtime-dispatch"]
avx512=["proof","zenmath/avx512","archmage/avx512"]
[dependencies]
zenmath={path="../../../zenmath",default-features=false,features=["correct-rounding"]}
archmage={path="../../..",default-features=false,features=["std"],optional=true}
zenhash={git="https://github.com/imazen/zenhash",rev="4c4a993ba4207f2f28529ce0406be8650d270118",default-features=false,features=["xxh3","std"]}
[patch.crates-io]
archmage={path="../../.."}
[profile.release]
lto="thin"
codegen-units=1
[lints.rust]
unsafe_code="forbid"
