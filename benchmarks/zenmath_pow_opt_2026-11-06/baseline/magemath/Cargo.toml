[package]
name = "magemath-pow-baseline"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
[features]
default = []
std = ["archmage/std","magetypes/std","zenmath/std"]
avx512 = ["archmage/avx512","magetypes/avx512","zenmath/avx512"]
[dependencies]
archmage = {path="../../../..",version="0.9.31-beta.2",default-features=false}
magetypes = {path="../../../../magetypes",version="0.9.31-beta.2",default-features=false}
zenmath = {package="zenmath-pow-baseline",path="../zenmath",default-features=false,features=["archmage"]}
