[package]
name="math-feature-consumer"
version="0.0.0"
edition="2024"
publish=false
[workspace]
[features]
default=[]
correct-rounding=["zenmath/correct-rounding","magemath?/correct-rounding"]
normal=["zenmath/normal","magemath?/normal"]
configurable=["zenmath/configurable","magemath?/configurable"]
archmage=["zenmath/archmage"]
runtime-dispatch=["zenmath/runtime-dispatch","magemath?/std"]
unified-std=["archmage","dep:archmage"]
vector=["dep:magemath"]
avx512=["archmage","zenmath/avx512","magemath?/avx512"]
[dependencies]
zenmath={path="../../../zenmath",default-features=false}
magemath={path="../../../magemath",default-features=false,optional=true}
archmage={path="../../..",default-features=false,features=["std"],optional=true}
[profile.release]
lto="thin"
