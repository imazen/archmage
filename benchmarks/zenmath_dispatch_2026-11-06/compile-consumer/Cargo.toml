[package]
name = "zenmath-compile-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
[workspace]
[features]
default = []
accelerated = ["zenmath/archmage"]
runtime-dispatch = ["accelerated", "zenmath/runtime-dispatch"]
avx512 = ["runtime-dispatch", "zenmath/avx512", "archmage/avx512"]
# Deliberately unify Archmage std while Zenmath runtime-dispatch stays off.
unified-std = ["accelerated", "dep:archmage", "archmage/std"]
[dependencies]
zenmath = { path = "../../../zenmath", default-features = false, features = ["correct-rounding"] }
archmage = { path = "../../..", version = "0.9.31-beta.2", default-features = false, optional = true }
