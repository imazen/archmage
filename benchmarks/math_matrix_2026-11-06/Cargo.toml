[package]
name = "math-matrix-study"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[features]
avx512 = ["archmage/avx512", "magetypes/avx512", "magemath/avx512"]
wasm-bench = ["zenbench/wasm"]
soft = ["libm/force-soft-floats"]
[dependencies]
archmage = { path = "../.." }
magetypes = { path = "../../magetypes", features = ["std"] }
magemath = { path = "../../magemath" }
zenmath = { path = "../../zenmath", features = ["std"] }
libm = "=0.2.16"
fpmath = "=0.2.0"
micromath = "=2.1.0"
metallic = "=0.3.1"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenbench = { version = "=0.1.11", default-features = false }
[profile.release]
lto = "thin"
[[bin]]
name = "wasm-host"
required-features = ["wasm-bench"]
