[package]
name = "archmage-portability-study"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[features]
default = []
avx512 = ["archmage/avx512", "magetypes/avx512"]

[dependencies]
archmage = { path = "../.." }
magetypes = { path = "../../magetypes" }
zenbench = "0.1.11"
serde_json = "1.0.151"

[profile.release]
codegen-units = 1
lto = "thin"
