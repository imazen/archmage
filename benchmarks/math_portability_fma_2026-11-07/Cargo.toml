[package]
name = "archmage-portability-study"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[features]
default = ["std"]
std = []
wasm-host = ["zenbench/wasm"]
avx512 = ["archmage/avx512", "magetypes/avx512"]

[dependencies]
archmage = { path = "../.." }
magetypes = { path = "../../magetypes" }
serde_json = "1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenbench = "0.1.11"

[profile.release]
codegen-units = 1
lto = "thin"
